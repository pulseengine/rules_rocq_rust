artifacts:
  - id: REQ-001
    type: requirement
    title: Proof-obligation build rules shall only report success on a version-matched, zero-exit kernel check
    status: approved
    priority: must
    description: >
      Addresses CC-001 / H-001. Applies to `rocq_library`, `rocq_proof_test`,
      and every proof-obligation rule this toolchain provides.
    fields:
      category: constraint
      upstream-ref: "pulseengine/rules_rocq_rust#31"
    links:
      - type: constraint-satisfies
        target: CC-001
      - type: satisfies
        target: H-001

  - id: REQ-002
    type: requirement
    title: The toolchain shall support machine-checked floating-point error-bound proofs, kernel-replaying every Gappa certificate
    status: approved
    priority: must
    description: >
      Add Flocq (fp model), the `gappa` binary (rounding-error layer),
      gappalib-coq (Gappa's Rocq support library, built from source against
      Flocq — nixpkgs has no `coq-gappa` package at this pin), and Coq-Interval
      + Coquelicot (approximation-error layer) to the toolchain flake, pinned
      against the bundled Rocq version. Any rule built on top of Gappa must
      satisfy CC-002 — the Gappa-emitted proof term is always replayed through
      the Rocq kernel, never trusted as-is.
    fields:
      category: functional
      upstream-ref: "pulseengine/rules_rocq_rust#37"
    links:
      - type: constraint-satisfies
        target: CC-002

  - id: DD-002
    type: design-decision
    title: Rely on Bazel action-failure semantics plus explicit Rocq-version pinning to satisfy REQ-001
    status: approved
    description: >
      Existing mechanism that already satisfies REQ-001 for today's
      `rocq_library`/`rocq_proof_test` rules.
    fields:
      decision: >
        `rocq_library` and `rocq_proof_test` invoke `coqc`/`rocq` as a Bazel
        action; a non-zero exit fails the action (and the build) directly, so
        there is no separate "report PASS" step that could mask a kernel
        failure. Version-matching is enforced by pinning every dependency
        (rocq-core, coqutil, hammer, smpl) to the single Rocq version declared
        in `MODULE.bazel`'s `rocq.toolchain()` per-repo, rather than resolving
        them independently — the smpl `.vo` version mismatch fixed in PR #30
        (16f6ff2, "build smpl against matching Rocq version") is this
        mechanism being repaired, not a new one being introduced.
      rationale: >
        Bazel's own action-failure propagation is a stronger oracle than any
        rule-level status flag the build script could set and get wrong; the
        gap that actually bit us (#31, PR #30) was a *dependency* pinned to
        the wrong Rocq version producing a `.vo` the kernel silently accepted
        as compatible, not the build masking a real failure.
      alternatives: >
        A rule-level "did the kernel actually check this" flag written by the
        build script — rejected as strictly weaker than letting the action
        itself fail, and it would be one more thing to get wrong.
      source-ref: "pulseengine/rules_rocq_rust#31, PR #30"
    links:
      - type: satisfies
        target: REQ-001

  - id: DD-001
    type: design-decision
    title: Layer Gappa (rounding) + Coq-Interval (approximation) + Flocq (fp model), kernel-replay every Gappa certificate
    status: approved
    description: >
      Toolchain architecture for issue #37's floating-point error-bound proof
      capability.
    fields:
      decision: >
        Add coq-flocq, coq-interval, and coq-coquelicot to the Nix-pinned
        toolchain flake via nixpkgs (coqPackages.flocq/interval/coquelicot,
        already built against the exact same Rocq 9.0.1 as the rest of the
        toolchain), plus the standalone `gappa` binary (nixpkgs `gappa`, an
        external CLI, not a Coq plugin). nixpkgs has no `coq-gappa`/
        gappalib-coq package at this pin, so gappalib-coq (Gappa's Rocq
        support library — the `Gappa.Gappa_library` that Gappa's `-Bcoq`
        output `Require Import`s) is built from source against Flocq, the
        same way `smpl` is already built from source for this Rocq version
        (see gappalib_repository.bzl). A `gappa_proof` Bazel macro
        (rocq:defs.bzl) wraps the gappa-to-Rocq flow: it runs `gappa -Bcoq`
        in a genrule, then always compiles the emitted `.v` with
        `rocq_library` — there is no separate "gappa succeeded" status,
        only a normal coqc build that fails if the kernel rejects the proof.
        A complete kernel bound = Gappa (rounding, semi-automatic via
        interval arithmetic + rewriting) + Coq-Interval (approximation,
        Taylor-model/interval bounds on the minimax remainder) + Flocq (the
        underlying fp model) — and whatever wraps Gappa must always
        kernel-check its emitted Flocq proof term, never accept Gappa's own
        certificate-generation success as sufficient (see the
        controller-constraint on gappa-wrapping rules).
      rationale: >
        Gappa is semi-automatic and emits a Flocq/Rocq proof term the kernel
        checks — dramatically less manual labor than hand-written Rocq for the
        rounding-error layer (Cody-Waite reduction + Horner accumulation), but
        it does not cover the approximation-error layer (the minimax remainder
        bound), which needs Coq-Interval or an externally-checked Sollya
        certificate. Filed by the relay maintainer against relay's exhaustively
        enumerated f32 sin/cos kernels (worst abs error 1.19e-7, falcon
        MATHF32-P02) as the next assurance-level investment.
      alternatives: >
        Base Rocq + Flocq alone, with no Gappa/Coq-Interval — maximally
        flexible but hundreds of manual proof lines per function; rejected as
        the primary path (the crlibm/CORE-MATH literature shows this is a
        multi-week effort per kernel even with the tools).
      source-ref: "pulseengine/rules_rocq_rust#37"
    links:
      - type: satisfies
        target: REQ-002

  - id: DD-003
    type: design-decision
    title: Use coq_9_0.withPackages to resolve Coq-Interval's transitive closure, instead of hand-wiring each nixpkgs sub-package
    status: draft
    description: >
      Proposed fix for the Coq-Interval usability gap (the approximation-layer
      feature, PR #43). Not yet implemented -- a design decision awaiting a
      follow-up PR.
    fields:
      decision: >
        Coq-Interval's real dependency closure is bignums + coquelicot +
        flocq + mathcomp-boot + mathcomp-fingroup (per nixpkgs
        `coqPackages.interval.propagatedBuildInputs`), and mathcomp-boot
        itself needs hierarchy-builder, which needs coq-elpi (a real OCaml
        findlib plugin, not a plain .v library) -- whose own OCaml deps
        (ppx_deriving.runtime, ...) go deeper still. Hand-wiring each as a
        separate nixpkgs_package + -Q flag (the pattern this toolchain uses
        for coqutil/Hammer/smpl/Flocq/Interval/Coquelicot) doesn't scale past
        this point: PR #43 tried the next package in the chain and still
        didn't reach a working state after enumerating 5 packages by hand.
        `coq_9_0.withPackages (p: [p.flocq p.interval p.coquelicot])` resolves
        the *entire* transitive closure automatically -- verified: its coqc
        compiles `Require Import Interval.Tactic. Goal (1+1<=3)%R. Proof.
        interval. Qed.` cleanly (exit 0), including the coq-elpi OCaml plugin
        load, which no manual -Q/OCAMLPATH assembly reached. Two ways to land
        it: (a) a second, withPackages-composed coqc scoped to the
        approximation-layer packages only (rocq_toolchain_info currently
        assumes one coqc for every compile), or (b) unify the whole toolchain
        (coqutil/Hammer/smpl included) onto withPackages, which would also
        retire the hand-rolled Hammer OCAMLPATH/ocaml_plugins wiring.
      rationale: >
        withPackages is nixpkgs' own answer to exactly this problem class
        (deep, OCaml-plugin-laden Coq dependency graphs) -- reinventing its
        closure resolution by hand is the same mistake #41 already made once
        (missing bignums) and PR #43 repeated (wrong mathcomp attribute,
        still missing bignums/HB/elpi). Verified empirically, not assumed:
        the .vo load path is also just a single `-Q <tree>/user-contrib ""`
        once the subdirs are already named Flocq/Interval/mathcomp/etc.
      alternatives: >
        Continue hand-wiring mathcomp-boot + mathcomp-fingroup + bignums +
        hierarchy-builder + coq-elpi + coq-elpi's own OCaml findlib deps
        individually -- rejected: the OCaml findlib chain for elpi didn't
        terminate in manual testing (ppx_deriving.runtime was the next
        missing piece with no guarantee it's the last), and every new
        approximation-layer dependency added later would repeat this same
        multi-hour chase.
      source-ref: "pulseengine/rules_rocq_rust#43 (review comment), #41"
    links:
      - type: satisfies
        target: REQ-002

  - id: FEAT-001
    type: feature
    title: Machine-checked FP error-bound proofs (Flocq + Gappa + Coq-Interval)
    status: draft
    description: >
      Toolchain capability requested in #37, enabling a raise-assurance proof
      on top of relay's existing exhaustive-enumeration empirical bound.

      Rounding layer (Gappa + Flocq) is implemented and verified via `bazel
      test //examples/gappa_proof:rounding_bound_test` -- exercises the full
      chain (a `.gappa` rounding-bound statement, Gappa's `-Bcoq` codegen, a
      real Rocq kernel check of the emitted proof term against
      gappalib-coq/Flocq) -- PASSED.

      Approximation layer (Coq-Interval) is NOT usable yet, despite #41
      fetching the package: `Require Import Interval.Tactic` fails (Coq-Interval
      needs mathcomp-boot/mathcomp-fingroup + bignums + hierarchy-builder +
      the coq-elpi OCaml plugin, none of which #41 wired in -- caught by
      PR #43's own report and independently re-verified against nixpkgs
      `propagatedBuildInputs`, see PR #43 review comment). Demoted back to
      draft until this is genuinely fixed and covered by a CI target that
      exercises `Interval.Tactic` -- not just fetches the package.
    fields:
      phase: phase-1
      acceptance-criteria:
        - "Toolchain flake provides flocq, gappa (binary), gappalib-coq, pinned against the bundled Rocq version -- DONE (rocq/extensions.bzl, rocq/private/gappalib_repository.bzl)"
        - "rocq_library (or a new gappa_proof rule) can depend on the new packages' .vo/include paths -- DONE (gappa_proof macro, rocq/defs.bzl)"
        - "Coq-Interval is actually usable (Require Import Interval.Tactic resolves and a smoke proof compiles) -- NOT DONE; needs mathcomp-boot/fingroup + bignums + hierarchy-builder + coq-elpi OCaml plugin wiring, verified working via coq_9_0.withPackages but not yet wired into Bazel (see PR #43)"
        - "A minimal example proves one f32 rounding bound end-to-end, kernel-checked by Rocq, as the template for relay's kernels -- DONE (examples/gappa_proof, bazel test PASSED)"
    links:
      - type: satisfies
        target: REQ-002
      - type: implements
        target: DD-001
