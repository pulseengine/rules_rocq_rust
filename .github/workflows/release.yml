name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    # Stays on ubuntu-latest: build step runs `bazel build`; Bazel not on smithy.
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Get version
      id: version
      run: |
        # Extract version from tag
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref }}
        name: rules_rocq_rust v${{ steps.version.outputs.version }}
        body: |
          ## rules_rocq_rust v${{ steps.version.outputs.version }}
          
          ### 🎉 New Release!
          
          This release includes:
          - Production-ready toolchain
          - Full cross-platform support
          - rules_rust integration
          - Comprehensive examples
          - Complete documentation
          
          ### 📋 Changes
          
          See [CHANGELOG.md](https://github.com/pulseengine/rules_rocq_rust/blob/main/CHANGELOG.md) for details.
          
          ### 🚀 Usage
          
          ```bazel
          # Add to your MODULE.bazel
          bazel_dep(name = "rules_rocq_rust", version = "${{ steps.version.outputs.version }}")
          
          # Use in your BUILD files
          load("@rules_rocq_rust//coq_of_rust:defs.bzl", "coq_of_rust_library")
          
          coq_of_rust_library(
              name = "my_rust",
              rust_sources = ["main.rs"],
              edition = "2021"
          )
          ```
          
          ### 📦 Assets
          
          - Toolchain: Ready to use
          - Examples: Simple and advanced
          - Documentation: Complete guide
        files: |
          README.md
          LICENSE
        draft: false
        prerelease: false
      
    - name: Build and test release
      run: |
        echo "Testing release v${{ steps.version.outputs.version }}..."

        # Build the example (test/ directory was removed)
        bazel build //examples/rust_to_rocq:all

        echo "Release v${{ steps.version.outputs.version }} is ready!"
