name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Pin nixpkgs for reproducibility
  NIXPKGS_CHANNEL: nixpkgs=channel:nixos-unstable

jobs:
  # Basic loading verification (fast, no nix required)
  verify-rules:
    name: Verify Rules Load
    # Light: bazel query only, no Nix (verified with a clean output base and no
    # nix on PATH). setup-bazelisk installs Bazel. Fork PRs stay on hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

    - name: Cache Bazel
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/bazel
        key: bazel-verify-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: |
          bazel-verify-${{ runner.os }}-

    - name: Verify rules load
      run: |
        echo "Verifying Bazel rules load..."
        bazel query //rocq/...
        bazel query //coq_of_rust/...
        echo "Rules load successfully"

  # Full build with nix toolchain (Linux)
  build:
    name: Build Example (Linux)
    # Stays on hosted ubuntu-24.04 (pinned; 26.04 moves are a deliberate PR): needs Nix + Bazel + Rocq toolchain, none of which are on smithy.
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Nix
      uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      with:
        nix_path: ${{ env.NIXPKGS_CHANNEL }}

    # No host Rust toolchain is installed: rocq-of-rust is built by rules_rust
    # against a hermetic nightly+rustc-dev sysroot the build downloads itself
    # (see docs/rules_rust-migration.md).

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

    - name: Install cargo-audit (pinned release, sha256-checked)
      env:
        CARGO_AUDIT_VERSION: v0.22.1
        CARGO_AUDIT_SHA256: c32506f338bdcdaef5a17fb9f33abb6ecf9561324cfd34237fd335f9283a1eab
      run: |
        name="cargo-audit-x86_64-unknown-linux-musl-${CARGO_AUDIT_VERSION}"
        curl -sSfL -o "$RUNNER_TEMP/ca.tgz" "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2F${CARGO_AUDIT_VERSION}/${name}.tgz"
        echo "${CARGO_AUDIT_SHA256}  $RUNNER_TEMP/ca.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/ca.tgz" -C "$RUNNER_TEMP"
        echo "CARGO_AUDIT=$RUNNER_TEMP/${name}/cargo-audit" >> "$GITHUB_ENV"

    # Every lockfile committed, consistent with its manifests, and every
    # Cargo.lock audited. .bazelrc sets --lockfile_mode=error for every bazel
    # command in every job.
    - name: Lockfiles - committed, locked, audited
      run: tools/lockfile_check.sh

    # ci-controls.toml: lockfile-unlocked-bazel-dep, lockfile-missing,
    # lockfile-stale-cargo, lockfile-vulnerable.
    - name: Planted controls - lockfile gate must fail on each
      run: |
        expect_fail() {
          local id="$1" pattern="$2"; shift 2
          set +e; out=$("$@" 2>&1); rc=$?; set -e
          echo "$out" | tail -8
          if [ "$rc" -eq 0 ]; then echo "::error::$id passed: the lockfile gate is fail-open"; exit 1; fi
          echo "$out" | grep -qF "$pattern" || { echo "::error::$id failed, but not on the planted input"; exit 1; }
          echo "$id: planted control failed as required (exit $rc)"
        }
        cat ci-controls/lockfile-unlocked-bazel-dep/MODULE.bazel.append >> MODULE.bazel
        expect_fail lockfile-unlocked-bazel-dep "not permitted with --lockfile_mode=error" bazel query //rocq/...
        expect_fail lockfile-unlocked-bazel-dep "MODULE.bazel.lock is out of date with ./MODULE.bazel" tools/lockfile_check.sh
        git checkout -- MODULE.bazel
        git diff --exit-code -- MODULE.bazel MODULE.bazel.lock
        expect_fail lockfile-missing "has no committed Cargo.lock" tools/lockfile_check.sh ci-controls/lockfile-missing
        expect_fail lockfile-stale-cargo "Cargo.lock is out of date with" tools/lockfile_check.sh ci-controls/lockfile-stale-cargo
        expect_fail lockfile-vulnerable "RUSTSEC-2021-0003" tools/lockfile_check.sh ci-controls/lockfile-vulnerable

    # No Bazel cache on this job (#60). A restored ~/.cache/bazel holds
    # toolchain repos whose bin/coqc links into the previous runner's
    # /nix/store; on a fresh runner the link dangles, the toolchain reports
    # no coqc, and rocq_library degrades to source-only. 3 of 3 warm restores
    # failed (2026-11-13..15); a cold run takes about 3 min.

    - name: Build rocq-of-rust (hermetic rules_rust build)
      run: |
        echo "Building rocq-of-rust and the RocqOfRust library..."
        bazel build //coq_of_rust/rocq_of_rust:rocq-of-rust @rocq_of_rust_build//:rocq_of_rust_main
        echo "rocq-of-rust built"

    - name: Run tests
      run: |
        echo "Running all tests..."
        bazel test //examples/rust_to_rocq:all //examples/assumptions_check:all //examples/interval_proof:all //tests:all --test_output=errors
        echo "All tests passed"

    - name: Assumptions checker tests (real coqc, negative controls)
      run: |
        COQC="$(bazel info output_base)/external/+rocq+rocq_toolchains/bin/coqc" \
          ASSUMPTIONS_REQUIRE_COQC=1 \
          python3 rocq/private/assumptions_check_test.py -v

    - name: Collect verified artifacts
      run: |
        mkdir -p verified-artifacts
        find bazel-bin/examples -name "*.vo" -exec cp {} verified-artifacts/ \;
        find bazel-bin/examples -name "*.v" -exec cp {} verified-artifacts/ \;
        ls -la verified-artifacts/

    - name: Upload verified artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: verified-proofs-linux
        path: verified-artifacts/

    - name: Attest build provenance
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-path: verified-artifacts/*

    # Runs after artifact collection so the planted .vo is never attested.
    # ci-controls.toml: interval-admitted.
    - name: Planted control - Admitted lemma in an interval proof must fail the assumptions audit
      run: |
        cp -R ci-controls/interval-admitted/. .
        set +e
        out=$(bazel build //examples/interval_proof/planted:planted_assumptions_test 2>&1)
        rc=$?
        set -e
        rm -rf examples/interval_proof/planted
        echo "$out" | tail -20
        if [ "$rc" -eq 0 ]; then
          echo "::error::assumptions audit passed on the planted Admitted lemma: the gate is fail-open for rocq_interval_proof"
          exit 1
        fi
        echo "$out" | grep -q '^  planted_admitted: planted_admitted$' || { echo "::error::build failed, but not on the planted lemma"; exit 1; }
        echo "planted control failed as required (exit $rc)"

    # Last in the job: it re-analyzes with an overridden toolchain repo.
    # ci-controls.toml: dangling-coqc.
    - name: Planted control - dangling bin/coqc must fail the build
      run: |
        set +e
        out=$(ci-controls/dangling-coqc/run.sh 2>&1)
        rc=$?
        set -e
        echo "$out" | tail -20
        if [ "$rc" -eq 0 ]; then
          echo "::error::rocq_proof_test passed with a dangling bin/coqc: the source-only fallback is back (#60)"
          exit 1
        fi
        echo "$out" | grep -q 'no coqc in @@+rocq+rocq_toolchains//:coqc_bin' || { echo "::error::build failed, but not on the missing coqc"; exit 1; }
        echo "planted control failed as required (exit $rc)"

  # macOS build
  build-macos:
    name: Build Example (macOS)
    # Stays on macos-latest: smithy fleet is Linux-only.
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Nix
      uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      with:
        nix_path: ${{ env.NIXPKGS_CHANNEL }}

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

    - name: Cache Bazel
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/bazel
        key: bazel-build-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: |
          bazel-build-${{ runner.os }}-

    - name: Run tests
      run: |
        echo "Running all tests on macOS..."
        bazel test //examples/rust_to_rocq:all //examples/assumptions_check:all //examples/interval_proof:all //tests:all --test_output=errors
        echo "All tests passed on macOS"

    - name: Collect verified artifacts
      run: |
        mkdir -p verified-artifacts
        find bazel-bin/examples -name "*.vo" -exec cp {} verified-artifacts/ \;
        find bazel-bin/examples -name "*.v" -exec cp {} verified-artifacts/ \;
        ls -la verified-artifacts/

    - name: Upload verified artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: verified-proofs-macos
        path: verified-artifacts/

    - name: Attest build provenance
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-path: verified-artifacts/*

  # Buildifier check
  buildifier:
    name: Buildifier Check
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    # Same buildifier version and sha256 as the buildifier_prebuilt 8.5.1
    # dev dependency in MODULE.bazel, so local and CI results agree.
    - name: Install buildifier v8.5.1 (sha256-verified)
      run: |
        curl -fsSLo "$RUNNER_TEMP/buildifier" https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/buildifier-linux-amd64
        echo "887377fc64d23a850f4d18a077b5db05b19913f4b99b270d193f3c7334b5a9a7  $RUNNER_TEMP/buildifier" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/buildifier"

    - name: Check formatting
      run: BUILDIFIER="$RUNNER_TEMP/buildifier" tools/buildifier_check.sh

    # Planted control (ci-controls.toml, id buildifier-unformatted): the
    # same check on a copy with an unformatted tests/BUILD.bazel must fail.
    - name: Planted control - unformatted BUILD file must fail
      run: |
        scratch="$RUNNER_TEMP/plant-buildifier"
        rm -rf "$scratch" && mkdir -p "$scratch"
        git archive HEAD | tar -x -C "$scratch"
        cp -R ci-controls/buildifier-unformatted/. "$scratch/"
        set +e
        out=$(cd "$scratch" && BUILDIFIER="$RUNNER_TEMP/buildifier" tools/buildifier_check.sh 2>&1)
        rc=$?
        set -e
        echo "$out"
        if [ "$rc" -eq 0 ]; then
          echo "::error::buildifier check passed on the planted unformatted file: the gate is fail-open"
          exit 1
        fi
        echo "$out" | grep -q 'tests/BUILD.bazel # reformat' || { echo "::error::check failed, but not on the planted file"; exit 1; }
        echo "planted control failed as required (exit $rc)"

  # Doc-claim honesty gate (see claims.yaml / pulseengine claim-verification skill).
  # A stale/overclaiming README fails this job the same way an un-kernel-checked
  # proof fails a rocq_proof_test -- the claim IS the artifact being gated.
  claim-check:
    name: Claim Check
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install PyYAML
      run: pip install --break-system-packages --quiet pyyaml

    - name: Check doc claims against evidence
      run: python3 tools/claim_check.py claims.yaml
