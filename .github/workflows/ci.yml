name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Pin nixpkgs for reproducibility
  NIXPKGS_CHANNEL: nixpkgs=channel:nixos-unstable

jobs:
  # Basic loading verification (fast, no nix required)
  verify-rules:
    name: Verify Rules Load
    # Stays on ubuntu-latest: uses bazelbuild/setup-bazelisk; Bazel is not pre-installed on smithy.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@v3

    - name: Cache Bazel
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: bazel-verify-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: |
          bazel-verify-${{ runner.os }}-

    - name: Verify rules load
      run: |
        echo "Verifying Bazel rules load..."
        bazel query //rocq/...
        bazel query //coq_of_rust/...
        echo "Rules load successfully"

  # Full build with nix toolchain (Linux)
  build:
    name: Build Example (Linux)
    # Stays on ubuntu-latest: needs Nix + Bazel + Rocq toolchain, none of which are on smithy.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        nix_path: ${{ env.NIXPKGS_CHANNEL }}

    # No host Rust toolchain is installed: rocq-of-rust is built by rules_rust
    # against a hermetic nightly+rustc-dev sysroot the build downloads itself
    # (see docs/rules_rust-migration.md).

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@v3

    - name: Cache Bazel
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: bazel-build-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: |
          bazel-build-${{ runner.os }}-

    - name: Build rocq-of-rust (hermetic rules_rust build)
      run: |
        echo "Building rocq-of-rust and the RocqOfRust library..."
        bazel build //coq_of_rust/rocq_of_rust:rocq-of-rust @rocq_of_rust_build//:rocq_of_rust_main
        echo "rocq-of-rust built"

    - name: Run tests
      run: |
        echo "Running all tests..."
        bazel test //examples/rust_to_rocq:all //tests:all --test_output=errors
        echo "All tests passed"

    - name: Collect verified artifacts
      run: |
        mkdir -p verified-artifacts
        find bazel-bin/examples -name "*.vo" -exec cp {} verified-artifacts/ \;
        find bazel-bin/examples -name "*.v" -exec cp {} verified-artifacts/ \;
        ls -la verified-artifacts/

    - name: Upload verified artifacts
      uses: actions/upload-artifact@v4
      with:
        name: verified-proofs-linux
        path: verified-artifacts/

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: verified-artifacts/*

  # macOS build
  build-macos:
    name: Build Example (macOS)
    # Stays on macos-latest: smithy fleet is Linux-only.
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        nix_path: ${{ env.NIXPKGS_CHANNEL }}

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@v3

    - name: Cache Bazel
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: bazel-build-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: |
          bazel-build-${{ runner.os }}-

    - name: Run tests
      run: |
        echo "Running all tests on macOS..."
        bazel test //examples/rust_to_rocq:all //tests:all --test_output=errors
        echo "All tests passed on macOS"

    - name: Collect verified artifacts
      run: |
        mkdir -p verified-artifacts
        find bazel-bin/examples -name "*.vo" -exec cp {} verified-artifacts/ \;
        find bazel-bin/examples -name "*.v" -exec cp {} verified-artifacts/ \;
        ls -la verified-artifacts/

    - name: Upload verified artifacts
      uses: actions/upload-artifact@v4
      with:
        name: verified-proofs-macos
        path: verified-artifacts/

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: verified-artifacts/*

  # Buildifier check
  buildifier:
    name: Buildifier Check
    runs-on: [self-hosted, linux, x64, light]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@v3

    - name: Check formatting
      run: |
        curl -Lo buildifier https://github.com/bazelbuild/buildtools/releases/download/v7.3.1/buildifier-linux-amd64
        chmod +x buildifier
        ./buildifier --mode=check -r . || echo "Some files need formatting"

  # Doc-claim honesty gate (see claims.yaml / pulseengine claim-verification skill).
  # A stale/overclaiming README fails this job the same way an un-kernel-checked
  # proof fails a rocq_proof_test -- the claim IS the artifact being gated.
  claim-check:
    name: Claim Check
    runs-on: [self-hosted, linux, x64, light]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install PyYAML
      run: pip install --quiet pyyaml

    - name: Check doc claims against evidence
      run: python3 tools/claim_check.py claims.yaml
