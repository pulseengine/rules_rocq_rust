name: Comprehensive CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Multi-platform verification
  verify-multiplatform:
    name: Verify Rules (${{ matrix.os }})
    # Stays on hosted: needs Bazel (not on smithy) and macOS in matrix (smithy is Linux-only).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3
    
    - name: Verify rules load
      run: |
        echo "Verifying Bazel rules on ${{ matrix.os }}..."
        bazel query //rocq/...
        echo "✅ Rules load successfully on ${{ matrix.os }}"
