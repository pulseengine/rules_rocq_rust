name: Quick Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quick-test:
    name: Quick Test
    # Light: bazel query only, no Nix. setup-bazelisk installs Bazel. Fork PRs
    # stay on hosted.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3
      
    - name: Verify Bazel loads
      run: |
        echo "🚀 Verifying Bazel configuration..."
        
        # Just verify the rules load without errors
        bazel query //rocq/...
        
        echo "✅ Rules load successfully!"
